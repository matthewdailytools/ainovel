# 复制为 ainovel.toml。这里只保存密钥环境变量名称，真实密钥填写到 .env。
# 预算是两组 OpenAI Key 合计 USD 20；DeepSeek 单独 CNY 80。
# 可以降低上限；程序同时保留用户本轮授权的硬上限，换 Key 不重置账本。
data_dir = "~/.ainovel"

[budgets]
openai = 20
deepseek = 80

[accounts.openai_1]
kind = "openai"
key_env = "OPENAI_API_KEY"
# 每个账户独立配置工程字节上限，缺省为完整 JSON 请求体的 120,000 UTF-8 字节。
# max_input_bytes = 120000
# 可选 context_window_tokens 必须是明确的正整数，不按模型名推断窗口。
# 超过默认字节上限时，必须同时填写该模型已核实的窗口与 context_source。

[accounts.openai_2]
kind = "openai"
key_env = "OPENAI_API_KEY_2"
# 可为该账户单独选模型与推理强度，例如：
# model = "gpt-6.1-sol"
# reasoning_effort = "low"

[accounts.deepseek]
kind = "deepseek"
key_env = "DEEPSEEK_API_KEY"
# 仅工作台：none（默认）、low、high、max；显式开启才发送思考参数。
# reasoning_effort = "none"
# 可选长篇配置：2026-11-13 官方页列 deepseek-flash 为
# DeepSeek-V4.1-Flash-1017，窗口 1M tokens。仅核实窗口，不自动改变本例单价。
# model = "deepseek-flash"
# max_input_bytes = 512000
# context_window_tokens = 1000000
# context_source = "https://api-docs.deepseek.com/quick_start/pricing/"
# 发送前同时核对字节上限与：实际请求体字节数 + max_output + 4096 <= 窗口。

# 可选：保留原账户，另配同一密钥的思考模式，仍共用 CNY80 账本。
# [accounts.deepseek_thinking]
# kind = "deepseek"
# key_env = "DEEPSEEK_API_KEY"
# model = "deepseek-flash"
# reasoning_effort = "high"
# 可选：为结构化审查/整理预留包含思考的输出额度；不缩小模块原有更大上限。
# 仅显式配置生效，纯正文调用不受此项影响；窗口/共享预算和有限修正仍限制请求。
# structured_output_min_tokens = 16384
# 若纯正文也因思考耗尽额度，可另行显式预留；未配置时保持模块原值。
# text_output_min_tokens = 16384
# max_input_bytes = 512000
# context_window_tokens = 1000000
# context_source = "https://api-docs.deepseek.com/quick_start/pricing/"

# 2026-11-12 核对的保守计价；不计缓存折扣，OpenAI 使用长上下文上界，
# DeepSeek 使用高峰上界。界面显示配置单价估算，不冒充服务商账单。
# 更改模型时需增加该模型的明确单价；没有价格的模型不会发起付费请求。
[pricing."gpt-6-luna"]
currency = "USD"
input_per_million = "0.20"
output_per_million = "0.75"
source = "https://developers.openai.com/api/docs/models/gpt-6-luna"

# 可选 Sol：未配置仍缺省 120,000 UTF-8 字节。
# 2026-11-14 核对该模型窗口 1,050,000 Token；输入超过 272K Token 时阶梯加价。
# 已使用 gpt-6.1-sol 的账户可在各自 [accounts.xxx] 下明确配置：
# max_input_bytes = 240000
# context_window_tokens = 1050000
# context_source = "https://developers.openai.com/api/docs/models/gpt-6.1-sol"
# 只发送文本，完整请求的 UTF-8 字节作为保守 Token 上界，240,000 另留门槛余量。
# 不能只把上限改到模型窗口大小而继续沿用短输入单价；窗口设置不会自动改变价格。
# 2026-11-14 核对 Standard 单价；不计缓存折扣，不使用 Fast/Ultrafast。
[pricing."gpt-6.1-sol"]
currency = "USD"
input_per_million = "2"
output_per_million = "10"
source = "https://developers.openai.com/api/docs/models/gpt-6.1-sol"

[pricing."deepseek-flash"]
currency = "CNY"
input_per_million = "2"
output_per_million = "8"
source = "https://api-docs.deepseek.com/zh-cn/quick_start/pricing/"
