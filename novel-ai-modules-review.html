妖怪","民间传说","封神","神格","地方志怪"],"sources":["QD","FQ","ZG","WR"],"description":"区分文化材料、作者重构与故事中的世界真相。","audit":"神格、香火和因果应具有本世界的具体含义；民间传说的某一版本不自动代表全部传统。"},{"id":"science","title":"科幻 · 星际 · 赛博","family":"fantasy","tags":["硬科幻","太空歌剧","人工智能","时间旅行","赛博朋克","机甲"],"sources":["QD","SF","SW"],"description":"明确现实科学、推测前提和完全虚构技术的边界。","audit":"决定情节成立的科学前提优先核查；技术不能只在需要解围时出现而不影响其他社会活动。"},{"id":"apocalypse","title":"末世 · 灾难 · 废土","family":"fantasy","tags":["丧尸","天灾","病毒","极寒","废土","灾后重建"],"sources":["QD","FQ","WJ","SF"],"description":"把灾难机制、资源与人群秩序共同设计。","audit":"物资不应只按背包格子存在：保质、供水、排污、疾病和持续生产决定长期生存是否成立。"},{"id":"infinite","title":"诸天 · 无限流 · 副本","family":"fantasy","tags":["生存副本","诸天穿梭","轮回空间","任务","团队","时间循环"],"sources":["QD","FR","QJ"],"description":"每个副本有独立逻辑，跨副本也有持续的代价与方向。","audit":"避免用新副本清空旧代价；每次通关都应影响后续资源、关系、认知或主线。"},{"id":"rules","title":"规则怪谈 · 诡异求生","family":"mystery","tags":["规则文本","真假规则","污染","身份","诡异空间"],"sources":["FQ","FR","SA"],"description":"明确规则、认知误差与作者临时改规则之间的区别。","audit":"若规则可随时任意变化，角色推理与读者参与就会失去依据；隐藏条件也需要可追溯的线索。"},{"id":"mystery","title":"悬疑 · 推理 · 解谜","family":"mystery","tags":["本格","社会派","密室","日常之谜","法庭","单元案件"],"sources":["QD","FQ","ZJ"],"description":"区分事情真实如何发生、侦查者怎样理解、读者怎样知道。","audit":"推理结论不能依赖读者和角色从未获得的新规则；故意保留信息也要符合叙述视角。"},{"id":"crime","title":"刑侦 · 犯罪 · 惊悚","family":"mystery","tags":["刑侦","犯罪心理","追捕","黑色","法庭惊悚"],"sources":["QD","ZJ","LL"],"description":"以危险、人物处境和案件后果组织故事；专业程序另行核查。","audit":"专业身份不是万能通行证；刑侦、医疗、法律等关键流程应按故事地点和时代专项求证。"},{"id":"horror","title":"恐怖 · 灵异 · 民俗","family":"mystery","tags":["心理恐怖","鬼怪","民俗恐怖","克苏鲁","诅咒","怪物"],"sources":["QD","FQ","ZG","VP"],"description":"设计恐惧从何而来，以及它怎样改变人的感知和行为。","audit":"恐怖效果不只来自更多怪物或更强刺激；检查人物为何在乎，以及暂时安全为何值得相信。"},{"id":"history","title":"历史 · 架空 · 争霸","family":"society","tags":["真实历史","架空王朝","历史脑洞","穿越改史","王朝兴衰"],"sources":["QD","FE","MB","HI"],"description":"同时维护时代条件、虚构空间和改变历史的连锁后果。","audit":"知道现代知识不等于能立即工业化；原料、工具、组织、运输与利益阻力都需要进入因果链。"},{"id":"war","title":"军事 · 战争","family":"society","tags":["古代战争","近现代军事","未来战争","战役","军旅"],"sources":["QD","HI","SF"],"description":"专业战术细节需另证，设计框架先覆盖组织、物质条件与人物。","audit":"胜利依赖任务、组织、信息和补给；不能让一位主角的战力自动解决所有层级问题。"},{"id":"spy","title":"谍战 · 特工 · 政治惊险","family":"mystery","tags":["潜伏","身份博弈","情报","反间","密码","组织忠诚"],"sources":["QD","HI","VP"],"description":"以身份、信息可信度和关系风险为主要设计对象。","audit":"每个阵营都需要可理解的目标与判断；保密不能成为作者隐藏全部必要因果的理由。"},{"id":"urban","title":"都市现实 · 行业职业","family":"society","tags":["都市日常","现实主义","医生","律师","工程师","基层","职场"],"sources":["QD","FQ","LL"],"description":"职业体系与社会关系应真正影响人物的行动条件。","audit":"不能只把职场当作身份标签；人物完成工作需要的能力、协作、时间和责任都应可见。"},{"id":"business","title":"商战 · 创业 · 金融","family":"competition","tags":["创业","企业经营","产业","投资","商业博弈","年代经商"],"sources":["QD","FE","LL"],"description":"把商业成功还原为产品、组织、现金流和竞争的共同结果。","audit":"营业额、利润、现金与资产不能混用；胜负也不能只由主角知道一个秘密决定。"},{"id":"superpower","title":"都市异能 · 脑洞","family":"fantasy","tags":["都市高武","都市修真","觉醒","神豪","身份反差","超常职业"],"sources":["FQ","FE","SA"],"description":"把超常能力放进现代社会，并推演组织和日常的反应。","audit":"能力可以突破现实，但需要说明现实社会为何没有察觉、复制、利用或约束它。"},{"id":"romance","title":"现代爱情 · 婚恋","family":"relationship","tags":["现言","甜宠","豪门","职场婚恋","破镜重圆","爱情悲剧"],"sources":["FQ","FE","FC","RA"],"description":"分别设计两个人的独立生活，以及关系为什么会发展和改变。","audit":"RWA 的 romance 定义要求积极的关系结局；中文言情范围更广，平台应明确本书承诺，允许作者选择悲剧或开放爱情。"},{"id":"ancient","title":"古代爱情 · 仙侠情缘","family":"relationship","tags":["古言","古风世情","玄幻言情","师徒情缘","神仙爱情"],"sources":["FQ","FC","GX","RA"],"description":"时代或超常规则既是情感环境，也会实质改变关系。","audit":"不能只用命定、契约或前世解释感情；本世人物仍需要可读的经历、行动和选择。"},{"id":"palace","title":"宫斗 · 宅斗 · 权谋","family":"society","tags":["宫廷","家族","后宅","主母","继承","权力博弈"],"sources":["FE","FC","GX","HI"],"description":"设计资源、身份、制度和关系如何使每次选择产生后果。","audit":"谋略需要资源、证据、执行者和制度条件；所有对手都无理由失去判断力，会削弱博弈。"},{"id":"era","title":"年代 · 乡土 · 家庭","family":"relationship","tags":["年代文","乡村","家长里短","婚姻家庭","女性成长","代际"],"sources":["FE","LL","HI"],"description":"把时代物质条件、制度变化和亲密关系写进同一生活。","audit":"年代不能只靠复古物件表现；制度、物价、劳动和家庭选择需要符合故事的具体时空。"},{"id":"farm","title":"种田 · 经营 · 基建","family":"competition","tags":["乡村经营","店铺","美食经营","领地","家族","文明建设"],"sources":["QD","FE","FC","WR"],"description":"核心是持续生产、组织和生活改善，不只是获得第一桶金。","audit":"经营不能只累计成果；增长需要劳动力、维护、需求、组织与外部关系共同支撑。"},{"id":"game","title":"游戏 · 网游 · 全息","family":"competition","tags":["MMO","全息网游","游戏异界","玩家","虚拟世界"],"sources":["QD","HD","SA"],"description":"分别设计游戏规则、玩家生活和虚拟世界的真实程度。","audit":"游戏更新和玩家学习会改变旧优势；NPC若具备真实人格，世界伦理与资源系统也会变化。"},{"id":"esports","title":"电竞 · 职业赛事","family":"competition","tags":["职业战队","联赛","青训","退役","重返赛场"],"sources":["QD","HD","LH"],"description":"职业竞争同时依赖游戏版本、团队和人的生涯。","audit":"胜负需要可理解的项目规则与团队作用；主角高光不应抹掉队友和对手的专业判断。"},{"id":"sports","title":"体育 · 竞技","family":"competition","tags":["足球","篮球","田径","围棋","赛车","教练","体育经营"],"sources":["QD","LH"],"description":"竞技过程、项目条件和生涯选择共同产生阅读回报。","audit":"现实项目的规则与赛历需按故事时代核对；比赛过程为什么这样发展，比直接宣布获胜更关键。"},{"id":"campus","title":"校园 · 青春 · 成长","family":"relationship","tags":["青春甜宠","友情","升学","社团","成长","毕业"],"sources":["FE","CW","VP"],"description":"学校是具体制度环境，成长包括友情、家庭、自我与未来。","audit":"不要把年龄标签当作统一人格；人物的家庭、经验和具体处境会产生不同成长路径。"},{"id":"entertain","title":"娱乐圈 · 文艺 · 传媒","family":"competition","tags":["影视","音乐","文学","导演","偶像","直播","创作者"],"sources":["QD","FQ","LL"],"description":"作品创作、行业生产和公众形象是不同层面的竞争。","audit":"热度、收入、奖项和艺术评价并非同一个尺度；作品取得成果需要看得见的过程和条件。"},{"id":"daily","title":"生活日常 · 美食 · 旅行","family":"relationship","tags":["慢生活","美食","旅行","赶山","宠物","治愈","日常喜剧"],"sources":["FQ","FE","LL","VP"],"description":"低外部冲突也需要观察、关系、感受和生活变化。","audit":"日常可以慢，但需要具体生活的质地；治愈并不等于所有困难自动消失。"},{"id":"kids","title":"儿童 · 童话 · 少年冒险","family":"expression","tags":["童话","儿童小说","少年冒险","动物故事","系列成长"],"sources":["CW","WR","VP"],"description":"受众维度可与任何世界背景组合，需要独立处理理解、表达和角色行动。","audit":"儿童文学不是成人故事删减版；年龄、能动性、语言和情绪承载需要重新设计。"},{"id":"literary","title":"文学 · 心理 · 实验叙事","family":"expression","tags":["现实主义","心理","意识流","家族史","实验","寓言"],"sources":["PG","VP","LL"],"description":"允许以意识、语言、形式和经验组织小说，也仍需要整体选择。","audit":"可以弱化外部情节，但应明确小说凭什么组织注意力、情感和意义；不能用公式强行校验艺术选择。"},{"id":"light","title":"轻小说 · 原创二次元","family":"expression","tags":["原创轻小说","校园幻想","异世界","群像","角色喜剧"],"sources":["QD","FQ","VP","SA"],"description":"轻小说是跨题材的受众和表达取向；同人衍生另由插件处理。","audit":"不能只组合人物标签；角色欲望、具体互动、事件后果和长线变化仍要成立。"},{"id":"beasts","title":"御兽 · 异兽 · 宠物成长","family":"fantasy","tags":["御兽","进化","契约","异兽","培育","宠物"],"sources":["QD","FQ","SA","WR"],"description":"伙伴是具有需求和行为的生命，不只是可替换的技能装备。","audit":"伙伴成长需要持续照护和资源；如果契约者有自我意志，交易、战斗和牺牲也需要相应叙事立场。"},{"id":"bureau","title":"都市官场 · 公共治理","family":"society","tags":["官场","基层","仕途","改革","公共服务","权力关系"],"sources":["FE","QD","LL"],"description":"以虚构故事中的职责、制度、资源和公共后果构建冲突。","audit":"职位提升与公共事务解决是不同结果；关键制度、权责与时代背景应单独核实。"},{"id":"explore","title":"探险 · 考古 · 盗墓想象","family":"mystery","tags":["遗迹","地下空间","寻宝","考古想象","荒野","海洋探险"],"sources":["QD","ZG","HI","SF"],"description":"区分真实考古材料与虚构冒险规则，重点设计环境和探索因果。","audit":"谜题、危险和出口应有空间与历史依据；不能把真实考古等同于寻宝或破坏遗迹。"},{"id":"beastworld","title":"兽世 · 异种文明 · 星际情缘","family":"relationship","tags":["兽世","星际兽世","异种","跨物种关系","生存建设"],"sources":["FE","FC","WR","RA"],"description":"身体差异、繁衍、社会结构与亲密关系需要一起设计。","audit":"物种设定不应自动取消人物的选择；生物机制、制度和个人意愿需要分开说明。"}],"plugins":[{"id":"plugin-1","title":"穿越","items":["来源世界与目标世界","身体身份和记忆","带入物品知识的限制","时间是否双向同步","原世界关系如何处理"]},{"id":"plugin-2","title":"重生","items":["回到何时及原因","记忆准确性","历史改变后的信息失效","蝴蝶效应","重来一次的情感代价"]},{"id":"plugin-3","title":"穿书","items":["原书是否可靠","人物是否独立存在","剧情偏离机制","原角色与新身份","读者先验知识何时失效"]},{"id":"plugin-4","title":"快穿","items":["世界进入退出条件","任务由谁定义","身份和记忆保留","跨世界关系","长线目标与最终结束"]},{"id":"plugin-5","title":"系统与任务","items":["系统来源和目的","奖励与约束","信息是否可信","惩罚边界","系统不能替人物解决什么"]},{"id":"plugin-6","title":"随身空间与两界","items":["容量与供能","时间和生产条件","物品带入带出","跨界供需影响","空间暴露与失去的后果"]},{"id":"plugin-7","title":"无敌与长生","items":["无敌覆盖哪些方面","无法靠战力解决的问题","寿命和长期关系","读者期待来自哪里","优势是否仍有代价"]},{"id":"plugin-8","title":"反派与复仇","items":["人物行为立场","复仇对象及证据","对无辜者的影响","代价和底线","目标达成后还剩什么"]},{"id":"plugin-9","title":"幕后与群像","items":["多方独立目标","主角信息与控制边界","因果链和执行者","视角切换","不同人物的可读性与回报"]},{"id":"plugin-10","title":"第四天灾与玩家群","items":["玩家进入机制","本地世界是否真实","复活和资源供给","群体行为对社会的影响","管理员无法完全控制的部分"]},{"id":"plugin-11","title":"领主与家族发展","items":["领地或家族的收入","成员权利义务","继承和退出","规模扩张与治理成本","个体与集体目标的冲突"]},{"id":"plugin-12","title":"直播与公众叙事","items":["直播为什么存在","平台和观众","信息可见范围","内容生产和收益","名声改变现实行动的方式"]},{"id":"plugin-13","title":"鉴宝与收藏","items":["鉴定知识来源","真伪判断证据","物品历史与流通","价格和市场","所有权及人物利益"]},{"id":"plugin-14","title":"医术与专业能力","items":["技能训练来源","职业权限与责任","团队和流程","失败及不确定性","关键专业事实的核查清单"]},{"id":"plugin-15","title":"工业基建与科技树","items":["原料与能源","设备和测量","工艺与技能","维护运输及组织","技术扩散后的利益变化"]},{"id":"plugin-16","title":"喜剧与反差","items":["笑点具体来源","铺垫与回收","人物愿望不能被标签替代","严肃段落的切换","重复笑点如何变化"]},{"id":"plugin-17","title":"治愈与慢节奏","items":["人物真实的缺失","安定感来自何处","被理解的具体行动","不被抹掉的困难","情绪改善的长期依据"]},{"id":"plugin-18","title":"甜宠与团宠","items":["关爱怎样表现","被爱者的自主性","互相付出","冲突和边界","感情之外的独立生活"]},{"id":"plugin-19","title":"虐恋与悲剧","items":["痛苦源于何种选择","冲突是否可避免","人物并非只为受苦存在","牺牲的后果","结局与前文承诺一致"]},{"id":"plugin-20","title":"关系组合与无CP","items":["爱情是否主线","BG双男主双女主等关系约定","各方独立目标","亲密与同意边界","无CP时友情和其他关系的分量"]},{"id":"plugin-21","title":"女性成长与主体性","items":["人物自己的目标","资源和制度限制","技能与选择","关系能否支持自主","成长不能只有地位或婚恋结果"]},{"id":"plugin-22","title":"同人衍生","items":["所用原作版本","保留和改动的设定","原人物性格依据","新增人物及剧情的影响","跨作品规则兼容","拟使用素材的授权或适用条件待核实"]},{"id":"plugin-23","title":"神话与文化改写","items":["参考传统和具体版本","哪些是改写","宗教民俗与历史的差异","不同群体视角","新故事的独立命题"]},{"id":"plugin-24","title":"宠物与动物视角","items":["物种感知和需求","行为与训练","拟人化程度","照护资源","动物的独立作用"]},{"id":"plugin-25","title":"短篇与中篇","items":["中心体验和有限人物","信息压缩","有限场景的多重作用","转折与回响","结尾后读者理解的变化"]},{"id":"plugin-26","title":"长篇连载与系列","items":["阶段回报","新旧读者信息","人物和规则的长期记录","避免重复扩张","本书完成与续作空间"]},{"id":"plugin-27","title":"多线与非线性","items":["真实时间顺序","呈现顺序","每次跳转的阅读收益","人物知识状态","线索重组后的可理解性"]},{"id":"plugin-28","title":"随机与概率能力","items":["概率规则及可观察证据","随机结果的实际约束","角色如何决策","运气不能连续替代因果","读者能否理解风险"]}],"policies":[{"id":"P01","title":"创作者只承担三类创作决定","text":"情绪、核心钩子和情节方向可以按全书／卷弧／章节表达。人物、世界、功法、社会与具体桥段由 AI 补全；题材可由系统推断，下面的组合选择只用于审阅方案。"},{"id":"P02","title":"普通空白自主补全","text":"人名、功法名、背景细节、配角、场景安排和未锁定的支线采用系统生成方案，不把 1,788 个设计项变成作者必填表。完整性按本次相关范围检查。"},{"id":"P03","title":"只有三类核心取舍返回作者","text":"更换情绪回报、更换核心追问、改变固定事件／结果／终局或关系约定时，给出少量可比较选项及影响。可在原方向内修复的设定和正文，由 AI 返工。"},{"id":"P04","title":"运行故障与创作决定分开","text":"认证、网络、版本冲突、预算耗尽和资料访问失败属于运行状态。系统按已配置的有限策略恢复，失败保留现场；不能把它们伪装成作者必须审核人物卡。运行配置属于一次性使用设置，不增加创作表单。"},{"id":"P05","title":"一个主题一个主责产物","text":"主责模块维护定义；专项模块维护自己的案件、对局或项目产物，通过引用连接。相互冲突时提交版本化修改请求，不绕过主责方改全局事实。模块是可复用任务能力，不要求每项常驻一个 Agent。"},{"id":"P06","title":"依赖按版本成立","text":"静态图展示一轮产物的默认提供方；已有同型、同范围的有效产物可直接满足输入。设定检查使用 review_design 动作；章稿检查再要求正文和事实，避免先写正文才能审设定的死锁。"},{"id":"P07","title":"返工是新版本，不是循环依赖","text":"本轮生成与审查是有向无环依赖；审稿发现问题后建立下一修订轮。正文改动使旧事实提取和对应报告失效，再审后才能采纳。返工轮次、耗时与费用有有限上限。"},{"id":"P08","title":"最小展开与明确停止","text":"先建立足以起稿的一致设定包，世界、人物与结构的反馈通过工作版本协调。未来细节滚动展开；只对真正被引用的内容传播失效，不无限补全整部世界百科。"},{"id":"P09","title":"男频与女频分别配置，作者意图优先","text":"男频、女频是作品频道与读者承诺配置，不根据作者或读者生理性别推断写法。 同一题材保留男女频两套可调预设，不把女频等同言情，也不把男频等同升级或后宫。 覆盖优先级：作者明确契约与已锁定事实 → 本书题材及关系约定 → 频道预设。 频道由作品配置或作者原话继承；缺失时 M02 提出候选，普通空白由系统补齐，不要求新增大表单。 切换频道只改变待生成方案的焦点与检查配置；既有正文和世界事实保持版本保护，按实际引用分析影响。"}],"examples":[{"id":"cultivation","title":"修仙＋经营＋悬疑","genres":["xianxia","farm","mystery"],"plugins":[],"intent":{"emotion":"先为弱者憋屈，再看到他用聪明选择与代价赢回尊严。","hook":"下品灵根的人，为何出现在宗门封存名册中？","direction":"从个人求生写到打破传承垄断；谨慎行事，不转为称帝。"},"notes":["灵气由 M05 定义，境界功法由 M06 定义，宗门和灵石经济分别由 M08／M09 展开。","T10 经营项目引用产能与资源；T01 案件引用既有超常边界；M17 决定何时给读者答案。","读心、占卜、搜魂等能力一旦存在，案件设计必须先处理其适用条件。"]},{"id":"competition","title":"电竞＋青春成长","genres":["esports","campus"],"plugins":[],"intent":{"emotion":"从自卑和孤立走向被队友信任。","hook":"被逐出青训的人，能否证明那次失误并非能力不足？","direction":"首赛季止步半决赛，保留失败结果，把成长写在协作与选择中。"},"notes":["T02 管赛制和对局，M12／M13 管人物与队友关系。","固定半决赛失利进入 M01 契约，Q01 不能因为爽点自动改成夺冠。","Q05 检查赛程和规则，Q04 检查不懂项目的读者能否看懂关键选择。"]},{"id":"love","title":"古代爱情＋宫宅博弈","genres":["ancient","palace"],"plugins":[],"intent":{"emotion":"酸涩之后获得平等与安定。","hook":"两人为何持续帮助彼此，却拒绝承认最初的约定？","direction":"保留双方独立事业；结局共同离开权力中心，不牺牲一方目标换团圆。"},"notes":["M08 给出婚姻、财产、继承和退出条件；T05 以具体经历建立关系变化。","T11 的权谋任务必须有信息、资源和执行者，不让所有对手同时降智。","Q01 检查独立事业与退出方向，Q03 检查关系转折是否有事件证据。"]},{"id":"literary","title":"文学心理＋日常生活","genres":["literary","daily"],"plugins":["plugin-27"],"intent":{"emotion":"平静表面下逐渐感到失去，再留下温柔余韵。","hook":"叙述者为何每次回忆，都绕过同一顿晚饭？","direction":"不以惊天阴谋收尾；通过日常行动改变对母亲的理解，保留少量未说透之处。"},"notes":["T12 和 M14 明确非线性形式为何有作用；M17 维护回忆顺序与读者信息。","不强制每章升级、反转或外部冲突；Q03 检查心理和理解的推进。","Q06 接受有意留白，但核查中心经验是否形成完整回应。"]}],"requestSchema":{"run_id":"本次逻辑任务","module_id":"模块标识","action":"动作","target":{"novel_id":"作品","branch_id":"工作版本","scope":"book/arc/chapter/scene/selection","narrative_position":"目标位置；未知显式为空"},"author_contract_ref":{"artifact_id":"意图契约","revision":1},"base_story_commit_ref":"目标位置基线","input_refs":[{"artifact_id":"输入产物","revision":1,"kind":"类型"}],"topic_refs":["原框架主题标识"],"execution_policy_ref":"已配置的运行与采纳政策","audience_profile_ref":{"artifact_id":"creative_brief_...","revision":1,"path":"/payload/audience_profile"}},"resultSchema":{"run_id":"由服务绑定","status":"succeeded/needs_repair/blocked_creative/blocked_runtime/cancelled","candidate":{"artifact_id":"由服务分配","kind":"模块输出类型","schema_version":1,"revision":1,"status":"candidate","basis":"由服务记录实际读取版本，不采信模型自报","payload":"按模块输出 Schema 验证"},"findings":[{"check_id":"检查项","method":"program/semantic","severity":"blocker/suggestion","source_span":"固定版本位置","certainty":"确定程度","repair_owner":"返工模块"}],"unresolved":["资料不足或歧义"],"adoption":"独立 S03 回执；succeeded 不等于已采纳"},"sources":[{"id":"QD","title":"起点中文网公开首页","type":"平台分类","url":"https://www.qidian.com/","note":"核对玄幻、奇幻、武侠、仙侠、都市、现实、军事、历史、游戏、体育、科幻、诸天无限、悬疑灵异、轻小说等入口；未使用作品数量与榜单数据推断质量。"},{"id":"FQ","title":"番茄小说公开首页","type":"平台分类","url":"https://fanqienovel.com/","note":"核对都市脑洞、都市日常、都市修真、东方仙侠、玄幻脑洞、都市高武等公开类型名称；仅为可见页面快照。"},{"id":"FE","title":"番茄编辑说：榜单与题材观察","type":"官方编辑专题","url":"https://fanqienovel.com/writer/zone/article/7616327014571573272","note":"核对年代、种田、宫斗宅斗、青春甜宠等类型及组合方式；编辑的趋势判断不作为永久规律。"},{"id":"FC","title":"番茄文启剧燃联合征文","type":"官方编辑专题","url":"https://fanqienovel.com/writer/zone/article/7595564497767514174"," <script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('module-data').textContent),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moduleMap=new Map(DATA.modules.map(m=>[m.id,m]));
const layers={control:'意图与装配',design:'基础设计',specialist:'题材专项',planning:'叙事规划',production:'正文与记忆',review:'AI 审查',delivery:'定稿',service:'确定性服务'};
const reviewable=new Map([...DATA.modules.map(m=>[m.id,m.name]),...DATA.policies.map(p=>[p.id,p.title]),...DATA.coverage.map(t=>['topic:'+t.id,t.groupTitle+' / '+t.title])]);
const statusOptions=['未审阅','认可','需调整','待讨论'];
const state={view:'overview',module:'M05',audience:'male',audienceGenre:'xianxia',action:null,previousIntent:null,query:'',layer:'all',reviews:{},intent:{emotion:'',hook:'',direction:''},genres:new Set(['xianxia','farm','mystery']),plugins:new Set(),coverageGroup:'xianxia',coverageQuery:'',impact:'energy'};
let composing=false,storageAvailable=true;
const STORAGE='novel-ai-module-review-v1';
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'{}');if(saved.version===1){if(["male","female"].includes(saved.audience))state.audience=saved.audience;if(saved.reviews&&typeof saved.reviews==='object')for(const [id,r]of Object.entries(saved.reviews))if(reviewable.has(id)&&r&&typeof r==='object')state.reviews[id]={status:statusOptions.includes(r.status)?r.status:'未审阅',note:typeof r.note==='string'?r.note.slice(0,5000):''};if(saved.intent)for(const k of ['emotion','hook','direction'])if(typeof saved.intent[k]==='string')state.intent[k]=saved.intent[k].slice(0,5000);}}catch{storageAvailable=false;}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({version:1,audience:state.audience,reviews:state.reviews,intent:state.intent}));storageAvailable=true;$('saveStatus').textContent='审阅与创作意图已保存在当前浏览器；不会自动发送到聊天，可导出备份。';}catch{storageAvailable=false;$('saveStatus').textContent='浏览器未能保存。内容仍在本页，请导出审阅意见保留。';}}
const review=id=>state.reviews[id]||{status:'未审阅',note:''};
const link=(id)=>{const m=moduleMap.get(id);return `<button class="module-link" data-module="${id}"><span class="pill-number">${id}</span> ${esc(m.name)}</button>`;};
function reviewBox(id){const r=review(id),safe=id.replace(/:/g,'-');return `<div class="review-box"><h3>审阅这项设计</h3><label class="small" for="review-${safe}">判断</label><select id="review-${safe}" data-review="${id}">${statusOptions.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select><label class="small" for="note-${safe}">调整意见／遗漏内容</label><textarea id="note-${safe}" data-note="${id}" maxlength="5000" placeholder="例如：希望把功法设计与当前掌握状态分得更明确。">${esc(r.note)}</textarea><p class="notice">这是对模块方案的审阅，不会启动模型或修改正式小说。</p></div>`;}
function listNav(){const q=state.query.toLowerCase();const found=DATA.modules.filter(m=>(state.layer==='all'||m.layer===state.layer)&&(!q||[m.id,m.name,m.purpose,...m.fields.map(f=>f.description+' '+f.key),...m.context,...m.checks.map(c=>c.rule),...m.topicIds.map(id=>DATA.coverage.find(t=>t.id===id).title)].join(' ').toLowerCase().includes(q)));$('moduleList').innerHTML=found.map(m=>`<button class="genre-button" data-module="${m.id}" aria-pressed="${state.module===m.id&&state.view==='modules'}"><span class="module-number">${m.id}</span>${esc(m.name)}</button>`).join('');$('moduleSelect').innerHTML='<option value="">选择模块</option>'+found.map(m=>`<option value="${m.id}" ${state.module===m.id?'selected':''}>${m.id} ${esc(m.name)}</option>`).join('');$('moduleCount').textContent=`${found.length} / ${DATA.modules.length} 个模块匹配`+(!found.length?'；可清空搜索或调整分组。':'');}
function guard(m){if(m.id==='M22')return '仅有有效问题清单且仍在有限返工范围内时运行；无问题则跳过。';if(m.id==='M23')return '仅在 S03 已生成有效采纳回执后运行。';if(m.id==='Q06')return '仅在卷界或整书候选完成时触发；阶段完成不等于整书完成。';if(m.id==='M24')return '同版本全书完整性通过后执行；任何正文改动会使相关报告失效。';if(m.layer==='service')return '由应用在运行前、采纳时或运行后调用；不加入 AI 产物的静态依赖环。';return '目标范围、有效输入版本及本轮运行政策满足；只展开本轮相关的设计项。';}
function audiencePayload(){const profile=DATA.audiences.find(a=>a.id===state.audience);return{channel:profile.id,profile_version:profile.version,source:'当前审阅选择；实际平台由 M02 根据作品配置或意图生成',genre_variants:[...state.genres].map(id=>({genre:id,variant:state.audience+':'+id})),priority:'作者契约与锁定事实 > 本书题材和关系约定 > 频道预设',explicit_exceptions:'从作者契约引用，如无 CP、固定失败结果或非团圆终局'};}
function audienceView(){const genre=DATA.audienceVariants.find(g=>g.genre===state.audienceGenre)||DATA.audienceVariants[0];return `<div class="eyebrow">频道 × 题材 × 作者意图</div><h2>男频与女频分开配置，共用可组合的模块契约</h2><p class="lead">区分的是作品频道、阅读承诺与表达重点。下面是可调整的编辑预设；人物性别、是否恋爱、主线目标和结局仍由本书意图决定。原 ${DATA.basis.genreCount} 个题材均提供两套变体。</p><div class="callout"><strong>输入优先级：</strong>作者明确的情绪、核心钩子、情节方向及锁定事实 → 本书题材与关系约定 → 男频／女频预设。切换本页频道不会覆盖你已经输入的三项意图。</div><div class="split-toolbar"><div><label for="audienceGenre">比较同一题材的两套配置</label><select id="audienceGenre">${DATA.audienceVariants.map(g=>`<option value="${g.genre}" ${g.genre===genre.genre?'selected':''}>${esc(g.title)}</option>`).join('')}</select></div></div><div class="audience-compare">${DATA.audiences.map(a=>{const p=genre.profiles[a.id];return `<section class="panel"><h3>${a.name} · ${esc(genre.title)}</h3><div class="audience-detail"><strong>本题材的默认重心</strong>${esc(p.focus)}</div><div class="audience-detail"><strong>情绪组织</strong>${esc(p.emotion)}</div><div class="audience-detail"><strong>钩子候选重点</strong>${esc(p.hook)}</div><div class="audience-detail"><strong>人物与关系</strong>${esc(a.character)} ${esc(p.relationship)}</div><div class="audience-detail"><strong>节奏与终局</strong>${esc(a.pacing)} ${esc(a.ending)}</div><h4 class="section">专属检查配置</h4><ul class="contract-list">${p.checks.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>`}).join('')}</div><h3 class="section">差异怎样传入模块</h3><div class="table-wrap"><table><thead><tr><th>模块</th><th>读取或输出的频道内容</th></tr></thead><tbody><tr><td>M02</td><td>启动时已有频道引用可为空，在 creative_brief 中输出 audience_profile，记录来源、版本、题材变体与例外；不依赖自身输出。</td></tr><tr><td>M12／M13</td><td>选择人物动机与关系展开的重心，保留独立目标；不强制 CP、后宫或主角性别。</td></tr><tr><td>M15／M16／M17</td><td>分别调整结构重心、情绪承载、钩子与披露；固定情节结果和终局不变。</td></tr><tr><td>M19／M20</td><td>把同一版本配置带入场景和正文，避免不同任务串用相反的读者承诺。</td></tr><tr><td>Q01／Q03／Q04／Q05</td><td>在对应频道与题材的规则下给证据；作者明确要求是最高优先级。</td></tr><tr><td>S02／S03／S04</td><td>固定频道配置引用、拒绝过期应用，按真实引用分析修改影响。</td></tr></tbody></table></div><div class="module-links">${genre.profiles[state.audience].modules.map(link).join('')}</div><h3 class="section">女频修仙无 CP：不会被组合成言情</h3><p>例如作者指定“从压抑到自由；追问封存身份；以修行独立为方向，无 CP”，M02 采用女频修仙变体，M06 仍负责境界与功法，M08 负责宗门和身份制度，M17 推进身世秘密。频道本身不启用恋爱任务，Q01 阻止新增恋爱终局。男频情感主线同样可加载 T05，不受“男频只能升级”的限制。</p><h3 class="section">共同边界</h3><ul class="contract-list">${DATA.audiencePrinciples.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><details class="flat-detail"><summary>当前频道输入示例</summary><pre class="code">${esc(JSON.stringify(audiencePayload(),null,2))}</pre></details><h3 class="section">频道补充依据与推导边界</h3>${DATA.audienceSources.map(s=>`<p class="small"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>：${esc(s.note)}</p>`).join('')}<p class="notice">本页的男频／女频变体是供你审阅的模块配置提案，不是全站阅读数据统计，也不是所有男读者或女读者的统一偏好。</p>${reviewBox('P09')}`;}

function overview(){return `<div class="eyebrow">目标分工与审阅入口</div><h2>创作者的三项输入，变成可传递的创作契约</h2><p class="lead">人物卡、世界设定、大纲和章节细节由 AI 根据意图生成。作者可以按需介入，但不承担整套设计目录的填表工作。下方是方案审阅，不是实际小说生成入口。</p><div class="intent-grid intent-boxes">${[['emotion','情绪','希望读者先感到什么，后来感到什么？'],['hook','钩子','读者因为什么疑问、牵挂或期待继续读？'],['direction','情节方向','哪些事件、结果、关系或终局取向需要保持？']].map(([key,label,hint])=>`<div><label for="intent-${key}">${label}</label><textarea id="intent-${key}" data-intent="${key}" maxlength="5000" placeholder="${hint}">${esc(state.intent[key])}</textarea><p class="hint">${hint}</p></div>`).join('')}</div><div class="inline-actions"><button id="sampleIntent">载入修仙示例意图</button>${state.previousIntent?'<button id="undoIntent">撤销示例载入</button>':''}<button data-view="compose" class="primary">查看对应模块组合</button></div><div class="overview-count"><div><strong>${DATA.modules.filter(m=>m.layer!=='service').length}</strong><span>AI 创作与审查模块</span></div><div><strong>6</strong><span>确定性运行服务</span></div><div><strong>${DATA.coverage.length} / ${DATA.basis.topicCount}</strong><span>原主题均有主责与检查方</span></div><div><strong>${DATA.basis.itemCount}</strong><span>原设计项保留在映射中</span></div></div><div class="pipeline"><a href="#" data-jump="modules" data-target="M01"><strong>01 意图契约</strong>自然语言提取、分层继承、锁定方向</a><a href="#" data-jump="compose"><strong>02 按题材装配</strong>选模块、绑定输入、满足依赖</a><a href="#" data-jump="modules" data-target="M05"><strong>03 设计与规划</strong>世界、社会、人物、专属机制与全书</a><a href="#" data-jump="lifecycle"><strong>04 正文与状态</strong>章卡、写作、事实、同版本审查</a><a href="#" data-jump="modules" data-target="S03"><strong>05 修订与采纳</strong>方向内返工，防止覆盖和过期结果</a><a href="#" data-jump="modules" data-target="Q06"><strong>06 完结与交付</strong>按承诺与完整稿判断完成</a></div><h3 class="section">需要你审阅的分工原则</h3>${DATA.policies.map(p=>`<details class="coverage-row"><summary>${p.id} · ${esc(p.title)} <span class="status-hint" data-status-for="${p.id}">${esc(review(p.id).status)}</span></summary><p>${esc(p.text)}</p>${reviewBox(p.id)}</details>`).join('')}<div class="callout">模块是按输入、产物和返工边界划分的任务能力。多个模块可以共用模型角色；一次调用也可产出同一设定包中的多个子产物。${DATA.modules.length} 个模块不等于 ${DATA.modules.length} 个常驻 Agent。</div>`;}
function moduleView(){const m=moduleMap.get(state.module),action=m.actionContracts.find(a=>a.action===state.action)||m.actionContracts[0],actionDeps=action.defaultProviders,actionContext=action.action==='review_design'?['待检查的设定或规划候选及其来源版本','作者契约与已采纳基础设定快照','相关题材专项约束；尚不存在的正文不是前置']:action.action==='accept_design'?['设定或规划候选的固定版本','适用的设定检查报告与采纳政策','当前基础设定头与作品范围；不要求章稿事实']:m.context,owned=DATA.coverage.filter(t=>t.owner===m.id),consumers=DATA.modules.filter(n=>n.deps.includes(m.id)||n.optionalDeps.includes(m.id));return `<div class="eyebrow">${m.id} / ${esc(layers[m.layer])}</div><h2>${esc(m.name)}</h2><p class="lead">${esc(m.purpose)}</p><div class="meta"><span class="badge">${state.audience==='male'?'男频':'女频'}配置</span><span class="badge">${m.layer==='service'?'确定性服务':'AI 任务模块'}</span><span class="badge neutral">${owned.length} 个原框架主题归属</span><span class="badge neutral">${m.humanInput?'唯一接收作者三项创作输入':'输入由系统绑定，不要求作者填写'}</span></div><div class="split-toolbar"><div><label for="actionSelect">当前查看的动作</label><select id="actionSelect">${m.actionContracts.map(a=>`<option value="${esc(a.action)}" ${a.action===action.action?'selected':''}>${esc(a.label)}</option>`).join('')}</select></div></div><p class="notice">下方输入依赖按所选动作显示。设计检查不要求正文；章稿检查才要求正文与对应事实。</p><div class="callout"><strong>运行条件：</strong>${esc(action.guard)} · ${esc(guard(m))}</div><div class="contract-grid"><section class="panel"><h3>必需产物依赖</h3><p class="notice">默认提供方。已有同型、同范围、有效版本的产物可直接满足，不必从头重跑。</p><div class="module-links">${actionDeps.length?actionDeps.map(link).join(''):'<span class="muted">无上游 AI 产物硬依赖；使用系统快照和当前任务资料。</span>'}</div><h4 class="section">按组合启用的依赖</h4><div class="module-links">${m.optionalDeps.length?m.optionalDeps.map(link).join(''):'<span class="muted">无额外条件依赖。</span>'}</div><p class="notice">这些模块已被题材组合启用时，才加入依赖；不会为了填齐可选项加载全部专项模块。</p></section><section class="panel"><h3>本模块不接管什么</h3><ul class="contract-list"><li>不自行修改作者情绪、核心钩子、固定事件与终局。</li><li>不绕过其他模块改写其主责产物；提交引用或补丁请求。</li><li>不直接覆盖正式稿，不将候选、计划与已发生事实混用。</li><li>${m.layer==='service'?'按确定性契约管理状态，不承担文学优劣裁定。':'语义结果仍需校验；模型宣称完成不等于已经采纳。'}</li></ul></section></div><h3 class="section">输入 · 谁提供，读哪一版</h3><div class="table-wrap"><table><thead><tr><th>输入</th><th>来源与要求</th></tr></thead><tbody><tr><td>目标、范围、版本与作者契约</td><td>S01／S02 自动绑定作品、分支、叙述位置、契约修订和读取资格；不是作者新增表单。</td></tr><tr><td><code>audience_profile_ref</code></td><td>${m.audienceBinding==='optional_bootstrap'?'启动阶段可为空：继承已有频道或由 M02 产出，不形成自身依赖。':'M02 的 creative_brief 提供有效配置，必须绑定其修订。'} 当前审阅：${state.audience==='male'?'男频':'女频'}；作者契约优先。</td></tr>${action.requiredKinds.map(kind=>`<tr><td><code>${esc(kind)}</code></td><td>${actionDeps.filter(id=>moduleMap.get(id).kind===kind).join('、')||'系统按候选引用及历史快照绑定'}；必须与本次目标范围和版本相符。</td></tr>`).join('')}${actionContext.map((text,i)=>`<tr><td>本次资料 ${i+1}</td><td>${esc(text)}</td></tr>`).join('')}</tbody></table></div><h3 class="section">输出 · ${esc(m.kind)} / v1</h3><p class="notice">所有 AI 输出先是候选，带来源修订和任务身份。下列是 payload 字段草案；服务回执不冒充 AI 生成。</p><div class="table-wrap"><table><thead><tr><th>字段</th><th>类型</th><th>内容</th></tr></thead><tbody>${m.fields.map(f=>`<tr><td><code>${esc(f.key)}</code></td><td>${esc(f.type)}</td><td>${esc(f.description)}</td></tr>`).join('')}</tbody></table></div><p class="notice">本次资料按所选动作裁剪；设定检查不读取尚不存在的章稿。默认产物图展示章稿审查动作。</p><h3 class="section">动作与前置条件</h3>${m.actionContracts.map(a=>`<details class="coverage-row"><summary>${esc(a.label)}</summary><p><strong>必需类型：</strong>${a.requiredKinds.map(esc).join('、')||'当前任务与系统资料'}</p><p><strong>默认提供方：</strong>${a.defaultProviders.join('、')||'系统按候选引用绑定'}</p><p><strong>守卫：</strong>${esc(a.guard)}</p></details>`).join('')}<h3 class="section">检查项 · 程序与语义分开</h3><div class="criteria">${m.checks.map(c=>`<div class="criterion"><span class="small">${c.id} · ${c.method} · ${c.severity}</span>${esc(c.rule)}</div>`).join('')}</div><p class="notice">所有模块还统一检查目标、Schema、来源版本、取消状态与允许范围。语义问题必须给出位置／事实依据和确定性；审美建议不伪装客观错误。</p><div class="panel"><h3>失败与返工</h3><p>${esc(m.recovery)}</p><p class="section"><strong>返回作者的边界：</strong>仅在继续方案必须改变已明确的情绪、核心钩子或情节方向时，经 S01 汇总为少量取舍；名称、设定空白和普通修稿由 AI 完成。认证、预算等由运行状态处理。</p></div><h3 class="section">下游可能使用本产物</h3><div class="module-links">${consumers.length?consumers.map(n=>link(n.id)).join(''):'<span class="muted">由运行服务或交付环节消费。</span>'}</div><details class="flat-detail"><summary>对应原题材主题 · ${owned.length} 项</summary>${owned.length?owned.map(t=>`<p class="small">${esc(t.groupTitle)} / ${esc(t.title)} · <button class="module-link" data-topic="${t.id}">查看原设计项与检查方</button></p>`).join(''):'<p class="notice">这是新增的串联、审查或恢复职责，不虚构原框架覆盖条目。</p>'}</details><details class="flat-detail"><summary>查看输出 Schema 草案</summary><pre class="code">${esc(JSON.stringify(m.outputSchema,null,2))}</pre></details>${reviewBox(m.id)}`;}
function planFor(genreIds,pluginIds){const topics=DATA.coverage.filter(t=>t.group==='core'||genreIds.includes(t.group)||pluginIds.includes(t.id));const active=new Set([...topics.map(t=>t.owner),...topics.map(t=>t.reviewer),...'M01 M02 M15 M16 M17 M18 M19 M20 M21 M22 M23 M24 Q01 Q02 Q03 Q04 Q05 Q06'.split(' ')]);let changed=true;while(changed){changed=false;for(const id of [...active])for(const dep of moduleMap.get(id).deps)if(!active.has(dep)){active.add(dep);changed=true;}}const pending=new Set(active),done=new Set(),waves=[];while(pending.size){const wave=[...pending].filter(id=>[...moduleMap.get(id).deps,...moduleMap.get(id).optionalDeps.filter(d=>active.has(d))].every(d=>done.has(d))).sort();if(!wave.length)return{error:'模块依赖出现环，请调整方案。',topics,active:[...active],waves};waves.push(wave);for(const id of wave){pending.delete(id);done.add(id)}}return{topics,active:[...active].sort(),waves,services:DATA.modules.filter(m=>m.layer==='service').map(m=>m.id)};}
function compose(){return `<div class="eyebrow">题材决定模块与检查范围</div><h2>从题材组合，得到可执行的依赖方案</h2><p class="lead">实际平台由 M02 推断题材并提出可改建议。这里手动选题材用于审阅模块装配，不增加创作者的必填责任。只整理依赖和合同，不调用真实模型。</p><div class="inline-actions">${DATA.examples.map(e=>`<button data-example="${e.id}">${esc(e.title)}</button>`).join('')}</div><details class="panel"><summary><strong>调整本次题材与插件</strong></summary><h3 class="section">题材</h3><div class="checks">${DATA.genres.map(g=>`<label><input type="checkbox" data-genre="${g.id}" ${state.genres.has(g.id)?'checked':''}>${esc(g.title)}</label>`).join('')}</div><h3 class="section">跨题材插件</h3><div class="checks">${DATA.plugins.map(p=>`<label><input type="checkbox" data-plugin="${p.id}" ${state.plugins.has(p.id)?'checked':''}>${esc(p.title)}</label>`).join('')}</div></details><div class="inline-actions"><button id="buildPlan" class="primary">装配模块与依赖</button><button id="downloadPlan">导出本组合合同</button></div><div id="planResult" class="section" aria-live="polite"></div>`;}
function renderPlan(){const target=$('planResult');if(!target)return;if(!state.genres.size){target.innerHTML='<p class="callout warning" role="alert">请至少选择一个题材，再装配模块。</p>';return;}const p=planFor([...state.genres],[...state.plugins]);if(p.error){target.innerHTML=`<p class="callout warning" role="alert">${esc(p.error)}</p>`;return;}const example=DATA.examples.find(e=>e.genres.length===state.genres.size&&e.genres.every(id=>state.genres.has(id))&&e.plugins.length===state.plugins.size&&e.plugins.every(id=>state.plugins.has(id)));target.innerHTML=`<h3>装配结果（${state.audience==='male'?'男频':'女频'}）：${p.active.length} 个 AI 模块 ＋ ${p.services.length} 个确定性服务</h3><p class="lead">覆盖本组合 ${p.topics.length} 个原主题、${p.topics.reduce((n,t)=>n+t.items.length,0)} 个设计项；按任务裁剪展开，不要求一次写满。相同产物由一个主责方维护。</p>${example?`<div class="callout"><strong>此组合的关键分工</strong><ul>${example.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><p class="small">预制设计示例，不是模型实测结果。</p></div>`:''}<div class="callout"><strong>${state.audience==='male'?'男频':'女频'}配置已注入：</strong>${esc(DATA.audiences.find(a=>a.id===state.audience).promise)}<p class="small">相同模块合同按频道和题材加载不同展开重点与检查项；不会因选择女频自动增加恋爱模块。</p><button data-view="audience" class="module-link">比较当前题材的男女频配置</button></div><h3>一轮产物的依赖波次</h3><p class="notice">同波次只说明产物依赖允许并行，仍需通过版本、预算及资源守卫。M22 有问题才运行；M23 等采纳；Q06 等卷界／全书边界；M24 等同版本完结通过。进入下一修订轮时重新绑定版本，不将反馈画成静态依赖环。</p>${p.waves.map((wave,i)=>`<div class="wave"><div class="wave-index">波次 ${String(i+1).padStart(2,'0')}</div><div class="module-links">${wave.map(link).join('')}</div></div>`).join('')}<h3 class="section">确定性服务在运行边界介入</h3><div class="module-links">${p.services.map(link).join('')}</div><p class="notice">基础设定包可先用 review_design 审查并按政策采纳；不必先写出正文。整体方案并不要求每次任务调用所有已启用模块，已有有效产物可复用。</p>`;}
function coverage(){return `<div class="eyebrow">逐主题可追溯</div><h2>${DATA.coverage.length} 个原主题，都有主责模块与检查方</h2><p class="lead">保留原 ${DATA.basis.genreCount} 个题材族、18 个通用主题、${DATA.plugins.length} 个插件中的全部 ${DATA.basis.itemCount} 个设计项。映射完整只代表有归属，不代表模块已经实现或生成质量通过。</p><div class="split-toolbar"><div><label for="coverageGroup">原框架范围</label><select id="coverageGroup"><option value="all">全部主题</option><option value="core">通用设计底层</option>${DATA.genres.map(g=>`<option value="${g.id}" ${state.coverageGroup===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}<option value="plugins" ${state.coverageGroup==='plugins'?'selected':''}>跨题材插件</option></select></div><div class="grow"><label for="coverageSearch">筛选主题或设计项</label><input id="coverageSearch" type="search" value="${esc(state.coverageQuery)}" placeholder="如：灵气、功法、凡人社会"></div></div><div id="coverageResult" aria-live="polite"></div>`;}
function renderCoverage(){const q=state.coverageQuery.toLowerCase();const topics=DATA.coverage.filter(t=>(state.coverageGroup==='all'||t.group===state.coverageGroup)&&(!q||[t.title,...t.items,t.owner,t.reviewer].join(' ').toLowerCase().includes(q)));$('coverageResult').innerHTML=`<p class="small muted">${topics.length} 个主题匹配 · 所有映射均有且只有一个主责方。</p>`+(topics.length?topics.map(t=>`<details class="coverage-row" id="topic-${t.id}"><summary>${esc(t.title)}<div class="coverage-meta">${esc(t.groupTitle)} · 主责 ${t.owner} · 检查 ${t.reviewer} · ${t.items.length} 个设计项</div></summary><ul class="items section">${t.items.map(item=>`<li>${esc(item)}</li>`).join('')}</ul><div class="module-links">${link(t.owner)}${link(t.reviewer)}</div><p class="notice">主责方负责候选产物；检查按设计或正文动作选择，不把某一种检查误设为全部阶段的前置。定义、计划、已发生状态分开保存。</p>${reviewBox('topic:'+t.id)}</details>`).join(''):'<p class="empty">没有匹配的主题。可以清空搜索或切换范围。</p>');}
function lifecycle(){return `<div class="eyebrow">写作循环与修改传播</div><h2>自动写作靠闭环，不靠作者逐章补全设定</h2><p class="lead">所有节点都绑定作品、分支、目标位置及输入修订。下列是未来运行机制的设计；本页只演示合同与影响，不会执行付费模型任务。</p>${[
['01 写前固定资料','S02','读取目标章之前的状态、当前场景、允许披露的信息及直接承接原文。历史改写恢复当时上下文，后文计划仅作为不提前揭示的约束。'],
['02 滚动规划与正文','M18 M19 M20','在作者三项意图和有效设定内，细化近期事件、章卡和场景，写出候选正文。普通细节由 AI 决定；未锁定的新设定仍先是候选。'],
['03 同版本事实与审查','M21 Q01 Q02 Q03 Q04 Q05','提取候选事实，再分别检查意图、连续性、结构人物、语言与题材。程序查引用数量版本，模型查因果与表达；报告给证据和不确定性。'],
['04 有限返工与复检','M22 S04','存在问题时，定位主责方。改正文后重提事实和受影响检查；改规则或章卡则先让后续依赖失效。无问题直接跳过返工。'],
['05 一次采纳正文与事实','S03','按已设定的自动采纳政策校验当前版本、取消状态、锁定项和幂等键。正文与核心事实共同成功，之后才能推进下一章；不要求作者逐项确认。'],
['06 更新可重建记忆','M23','拿到采纳回执后构建摘要索引。未完成时回读原文或等待关键材料，不使用旧记忆硬写后续。摘要不是唯一事实源。'],
['07 阶段与全书关卡','Q06 M24 S06','卷界回看目标、人物和未了事项；到达终局后检查完整稿与承诺。按同版本定稿和导出，章数完成不等于全书完成。']
].map(([title,ids,text])=>`<article class="stage"><h3>${title}</h3><p>${text}</p><div class="module-links">${ids.split(' ').map(link).join('')}</div></article>`).join('')}<h3 class="section">改稿影响示意</h3><label class="small" for="impactCase">选择改动</label><select id="impactCase"><option value="energy">改变灵气来源或成本</option><option value="item">改掉前章物品转移</option><option value="emotion">只调整本章情绪</option></select><div id="impactResult" class="section" aria-live="polite"></div><div class="callout">实际 S04 必须依据“哪份产物确实引用过哪一版来源”传播失效。这里展示的是预制例子，不能拿模块层潜在依赖直接判定整部小说全部重写。正式历史保留，待复核与从未存在是两种状态。</div>`;}
function renderImpact(){const cases={energy:{steps:['M05 灵气规则新版','M06 成长与 M08 制度引用需复核','M09 经济与 T01 案件条件需复核','相关章卡与正文候选待重建','对应事实、报告与摘要失效'],keep:'未引用该规则的独立场景可保持；已采纳历史保存，相关后文标记待复核。'},item:{steps:['前章正文修订','M21 物品转移及知情变化重提','引用该物品的后章计划需复核','相关正文、Q02 报告失效','S03 采纳新版本后 M23 重建'],keep:'人物静态档案和能力定义不因这次物品转移自动重做。'},emotion:{steps:['本章意图覆盖更新','M16 本章情绪节拍调整','M19 场景承载范围内更新','M20／M22 正文候选局部修订','Q01／Q04 复检；事实改变时重提 M21'],keep:'世界规则、功法体系与既有社会制度无需整体重建；不自动改写已发布前文。'}};const c=cases[state.impact];$('impactResult').innerHTML=`<div class="flow">${c.steps.map((s,i)=>`${i?'<b>→</b>':''}<span>${s}</span>`).join('')}</div><p>${esc(c.keep)}</p>`;}
function protocol(){return `<div class="eyebrow">统一输入输出与失败语义</div><h2>模块互换与组合，需要共同契约</h2><p class="lead">下方为拟议协议示例。具体服务商、模型、数据库、费用上限和默认轮次尚未在此选择；它们由运行配置提供，不要求创作者在每个创作任务中重填。</p><div class="contract-grid"><section><h3>ModuleRequest</h3><pre class="code">${esc(JSON.stringify(DATA.requestSchema,null,2))}</pre></section><section><h3>ModuleResult</h3><pre class="code">${esc(JSON.stringify(DATA.resultSchema,null,2))}</pre></section></div><h3 class="section">状态与处理</h3><div class="table-wrap"><table><thead><tr><th>状态</th><th>含义</th><th>下一步</th></tr></thead><tbody><tr><td>succeeded</td><td>本次候选结构和范围有效，不代表正式稿已采用。</td><td>按阶段进入独立审查和 S03 采纳。</td></tr><tr><td>needs_repair</td><td>存在方向内可以修复的问题。</td><td>按主责与证据有限返工，绑定新版本再检查。</td></tr><tr><td>blocked_creative</td><td>可行方案必须改变作者核心意图。</td><td>只向作者展示情绪、钩子或方向取舍及影响。</td></tr><tr><td>blocked_runtime</td><td>配置、资源、版本、资料访问等阻塞。</td><td>系统恢复或明确停止原因，保留候选和上下文。</td></tr><tr><td>cancelled</td><td>本次任务已停止本地后续写入。</td><td>保留有效片段；旧响应和自动重试不得重新采纳。</td></tr></tbody></table></div><h3 class="section">产物所有权与事实层次</h3><div class="mapping-grid"><p><strong>M05／M06：定义</strong>灵气、功法和技能能做什么、条件与限制。角色是否掌握不是定义的一部分。</p><p><strong>M12：人物档案</strong>稳定身份、经历与行为倾向；动态处境从已发生事件重建。</p><p><strong>M15／M18：计划</strong>未来可能发生的事，不提前成为角色记忆和当前事实。</p><p><strong>M20／M22：正文候选</strong>生成及修订在版本范围内进行，正式写入只有 S03 一个入口。</p><p><strong>M21＋S03：已采用状态</strong>在具体叙述与故事位置，记录物品、能力掌握、关系和知情变化。</p><p><strong>M23：派生记忆</strong>摘要索引可重建，失效时回源，不覆盖正文与作者锁定项。</p></div><h3 class="section">最小验收场景</h3><ul class="contract-list"><li>作者指定“交易失败，不发生战斗”，流畅的成功交易章稿也应被 Q01 阻断。</li><li>前章材料已消耗，后章再次使用需有获取来源；否则 Q02 给出证据。</li><li>修仙＋推理组合引入搜魂术，案件必须先说明其条件、成本或为何不可用。</li><li>旧响应晚于作者新编辑返回，S03 拒绝覆盖并保留候选。</li><li>正文修订后，旧事实、旧审稿报告和旧完结报告不能继续标记为当前有效。</li><li>文学或儿童题材不因没有升级、章末危机或固定反转而自动失败。</li><li>只有章数达到目标而重要承诺未处理，Q06 仍返回需修订。</li></ul><details class="flat-detail"><summary>依据与方案边界</summary><p>源题材框架：<a href="novel-genre-design-review.html" target="_blank" rel="noopener">${esc(DATA.basis.file)}</a>。本次保留其 ${DATA.basis.topicCount} 个主题、${DATA.basis.itemCount} 个设计项，并逐项映射。本页的模块拆分、协议、依赖与检查是根据你的创作分工愿景形成的设计提案，未宣称已经通过真实模型的文学效果验证。</p><p class="small">源文件 SHA-256：<code>${DATA.basis.sha256}</code></p><p>题材框架原有 ${DATA.sources.length} 项来源继续用于题材内容依据；这些来源并不直接证明本次模块方案的工程效果。设计审阅页不调用模型、不发送你的批注。</p></details>`;}
function notes(){const entries=Object.entries(state.reviews).filter(([,r])=>r.status!=='未审阅'||r.note);return `<div class="eyebrow">本地审阅与批注</div><h2>我的审阅 · ${entries.length} 项</h2><p class="lead">可审阅模块边界、作者分工原则和原主题的归属。意见仅保存在当前浏览器；导出后可以交给我据此继续修改。</p>${entries.length?entries.map(([id,r])=>`<article class="notes-card"><h3 class="note-title">${esc(reviewable.get(id))} <span class="badge">${esc(r.status)}</span></h3><span class="small muted">${esc(id)}</span><p>${esc(r.note||'未填写文字批注')}</p>${moduleMap.has(id)?link(id):id.startsWith('topic:')?`<button class="module-link" data-topic="${id.slice(6)}">回到覆盖映射</button>`:`<button class="module-link" data-policy="${id}">回到分工原则</button>`}</article>`).join(''):'<p class="empty">尚无意见。选择模块或展开分工原则，即可标记与批注。</p>'}`;}
function render(){listNav();$('audienceChannel').value=state.audience;document.querySelectorAll('.tabs [data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));const views={overview,audience:audienceView,modules:moduleView,compose,coverage,lifecycle,protocol,notes};$('content').innerHTML=views[state.view]();if(state.view==='compose')renderPlan();if(state.view==='coverage'){const select=$('coverageGroup');select.value=state.coverageGroup;renderCoverage();}if(state.view==='lifecycle')renderImpact();}
function download(name,text,type='application/json;charset=utf-8'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('saveStatus').textContent='已生成下载，请确认浏览器下载结果。';}
function exportNotes(){download('novel-ai-module-review-notes.json',JSON.stringify({schema:'novel-ai-module-review-notes/1',version:DATA.version,source_hash:DATA.basis.sha256,audience_profile:audiencePayload(),intent:state.intent,selection:{genres:[...state.genres],plugins:[...state.plugins]},reviews:Object.entries(state.reviews).filter(([,r])=>r.status!=='未审阅'||r.note).map(([id,r])=>({id,title:reviewable.get(id),...r})),exportedAt:new Date().toISOString()},null,2));}
document.addEventListener('click',event=>{const button=event.target.closest('button'),jump=event.target.closest('[data-jump]');if(jump){event.preventDefault();state.view=jump.dataset.jump;if(jump.dataset.target)state.module=jump.dataset.target;render();return;}if(!button)return;if(button.dataset.module){state.module=button.dataset.module;state.view='modules';render();}else if(button.dataset.view){state.view=button.dataset.view;render();}else if(button.dataset.example){const e=DATA.examples.find(e=>e.id===button.dataset.example);state.genres=new Set(e.genres);state.plugins=new Set(e.plugins);state.audienceGenre=e.genres[0];render();}else if(button.dataset.topic){const t=DATA.coverage.find(t=>t.id===button.dataset.topic);state.coverageGroup=t.group;state.coverageQuery=t.title;state.view='coverage';render();const target=$('topic-'+t.id);if(target)target.open=true;}else if(button.dataset.policy){state.view='overview';render();}else if(button.id==='buildPlan')renderPlan();else if(button.id==='downloadPlan'){if(!state.genres.size){renderPlan();return;}const p=planFor([...state.genres],[...state.plugins]);if(p.error){renderPlan();return;}download('novel-ai-module-composition.json',JSON.stringify({schema:'novel-ai-module-composition/1',version:DATA.version,audience_profile:audiencePayload(),intent:state.intent,selection:{genres:[...state.genres],plugins:[...state.plugins]},topic_refs:p.topics.map(t=>t.id),modules:DATA.modules.filter(m=>p.active.includes(m.id)||p.services.includes(m.id)),waves:p.waves,guards:'依赖波次不是实际执行状态；按动作、范围、版本及阶段守卫运行。'},null,2));}else if(button.id==='undoIntent'&&state.previousIntent){state.intent={...state.previousIntent};state.previousIntent=null;save();render();}else if(button.id==='sampleIntent'){state.previousIntent={...state.intent};state.intent={...DATA.examples[0].intent};save();render();}else if(button.id==='exportNotes')exportNotes();else if(button.id==='exportRegistry')download('novel-ai-module-contracts.json',JSON.stringify(DATA,null,2));});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='audienceChannel'&&['male','female'].includes(el.value)){state.audience=el.value;save();render();}else if(el.id==='audienceGenre'){state.audienceGenre=el.value;render();}else if(el.id==='textSize'&&['16','20','24','32'].includes(el.value))document.documentElement.style.fontSize=el.value+'px';else if(el.id==='actionSelect'){state.action=el.value;render();}else if(el.id==='layerFilter'){state.layer=el.value;listNav();}else if(el.id==='moduleSelect'&&moduleMap.has(el.value)){state.module=el.value;state.view='modules';render();}else if(el.dataset.review&&reviewable.has(el.dataset.review)){const id=el.dataset.review;state.reviews[id]={...review(id),status:statusOptions.includes(el.value)?el.value:'未审阅'};save();document.querySelectorAll(`[data-status-for="${id}"]`).forEach(n=>n.textContent=el.value);}else if(el.dataset.genre){el.checked?state.genres.add(el.dataset.genre):state.genres.delete(el.dataset.genre);}else if(el.dataset.plugin){el.checked?state.plugins.add(el.dataset.plugin):state.plugins.delete(el.dataset.plugin);}else if(el.id==='coverageGroup'){state.coverageGroup=el.value;renderCoverage();}else if(el.id==='impactCase'){state.impact=el.value;renderImpact();}});
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.note&&reviewable.has(el.dataset.note)){state.reviews[el.dataset.note]={...review(el.dataset.note),note:el.value.slice(0,5000)};save();}else if(el.dataset.intent){state.intent[el.dataset.intent]=el.value.slice(0,5000);save();}else if(el.id==='coverageSearch'){if(event.isComposing)return;state.coverageQuery=el.value.trim();renderCoverage();}});
$('moduleSearch').addEventListener('compositionstart',()=>composing=true);$('moduleSearch').addEventListener('compositionend',event=>{composing=false;state.query=event.target.value.trim();listNav();});$('moduleSearch').addEventListener('input',event=>{if(!composing&&!event.isComposing){state.query=event.target.value.trim();listNav();}});
document.addEventListener('compositionend',event=>{if(event.target.id==='coverageSearch'){state.coverageQuery=event.target.value.trim();renderCoverage();}});
render();if(!storageAvailable)$('saveStatus').textContent='无法读取浏览器存储，可继续审阅并导出备份。';
})();
</script></body></html>
