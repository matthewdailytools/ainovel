function blocks(prefix,text){return text.trim().split('\n').filter(Boolean).map((line,i)=>{const [title,...rest]=line.split('：');return{id:prefix+'-'+(i+1),title,items:rest.join('：').split('；').filter(Boolean)}})}

const CORE=blocks('core',`
创作意图与方向：主要读者和阅读场景；核心故事命题；主线终点与允许的开放性；作者要坚持的价值取舍；不希望出现的剧情与关系
情绪体验：读者想经历的情绪；角色自身的情绪与外显行为；情绪起点与终点；压抑和释放的间隔；短线情绪与全书余韵
钩子与承诺：读者持续追问的具体问题；问题何时获得部分答案；角色或关系带来的牵挂；收益与风险的可感知性；兑现后的新期待
人物与能动性：欲望和需求；恐惧底线与矛盾；能力及认知局限；过去经验与当下压力；行动方式和失败选择；成长或保持信念的路径
关系与群像：利益依赖与情感纽带；权力差距和边界；关系开始改变的事件；配角独立目标；离场人物的后续生活；不同人物的声音
世界时空与环境：时代地理和尺度；交通通信与距离；季节历法与时间跨度；自然条件和人口分布；日常生活的物质基础
规则与能力：可实现与不可实现之事；谁能掌握和学习；使用条件及代价；可被对手利用的弱点；例外与前文依据；能力对社会的影响
社会与制度：权力从何而来；组织如何运行与继承；规则由谁执行；群体与阶层如何流动；制度如何奖励和惩罚人物；边缘者如何生存
经济与生产：资源来源与所有权；生产劳动及分工；分配交易与价格；税收债务与信用；成本损耗和基础设施；资源变化的后果
文化与共同生活：信仰与价值分歧；语言称谓和礼仪；婚姻亲属与照护；教育职业和知识传播；服饰饮食居住与娱乐；不同群体的内部差异

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceMap=new Map(SOURCES.map(s=>[s.id,s]));
const allBlocks=[...CORE,...GENRES.flatMap(g=>g.blocks),...PLUGINS];
const blockMap=new Map(allBlocks.map(b=>[b.id,b]));
const statuses=['未审阅','保留','需补充','不适用'];
const KEY='novel-design-review-v1';
const state={view:'catalog',genre:'xianxia',query:'',family:'all',status:'all',reviews:{},intent:{emotion:'',hook:'',direction:''},composeGenres:new Set(['xianxia']),composePlugins:new Set(),includeCore:true};
let canStore=true,composing=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&saved.version===1){if(saved.intent&&typeof saved.intent==='object')for(const key of ['emotion','hook','direction'])if(typeof saved.intent[key]==='string')state.intent[key]=saved.intent[key].slice(0,5000);if(saved.reviews&&typeof saved.reviews==='object')for(const [id,r]of Object.entries(saved.reviews))if(blockMap.has(id)&&r&&typeof r==='object')state.reviews[id]={status:statuses.includes(r.status)?r.status:'未审阅',note:typeof r.note==='string'?r.note.slice(0,5000):''};}}catch{canStore=false;}
const review=id=>state.reviews[id]||{status:'未审阅',note:''};
const itemCount=list=>list.reduce((n,b)=>n+b.items.length,0);
const normalized=value=>String(value).toLocaleLowerCase('zh-CN');
const matches=(block,query=state.query)=>!query||normalized(block.title+' '+block.items.join(' ')).includes(normalized(query));
function filteredBlocks(list){return list.filter(b=>matches(b)&&(state.status==='all'||review(b.id).status===state.status));}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,reviews:state.reviews,intent:state.intent}));canStore=true;$('saveStatus').textContent='已保存在当前浏览器。批注不会自动发送到聊天；可导出审阅意见备份。';}catch{canStore=false;$('saveStatus').textContent='浏览器未能保存；本页仍保留本次批注，请及时导出审阅意见。';}}
function sourceLinks(ids){return ids.map(id=>{const s=sourceMap.get(id);return s?`<a href="${escapeHTML(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(s.title)}</a>`:''}).join('');}
function renderNav(){const available=GENRES.filter(g=>(state.family==='all'||g.family===state.family)&&(!state.query||normalized(g.title+' '+g.tags.join(' ')+' '+g.description).includes(normalized(state.query))||g.blocks.some(b=>matches(b))));$('genreList').innerHTML=available.map(g=>`<button class="genre-button" data-genre="${g.id}" aria-pressed="${g.id===state.genre}"><span class="number">${String(GENRES.indexOf(g)+1).padStart(2,'0')}</span>${escapeHTML(g.title)}<span>${g.blocks.length}</span></button>`).join('');$('genreSelect').innerHTML='<option value="">选择题材</option>'+available.map(g=>`<option value="${g.id}" ${g.id===state.genre?'selected':''}>${escapeHTML(g.title)}</option>`).join('');$('searchCount').textContent=`${available.length} / ${GENRES.length} 个题材族匹配；数字为题材专属设计主题数。`;}
function blockHTML(b,index,open=false){const r=review(b.id);return `<details class="design-block" id="block-${b.id}" ${open?'open':''}><summary><h3>${String(index+1).padStart(2,'0')} · ${escapeHTML(b.title)}</h3><span class="block-meta"><span data-status-for="${b.id}">${escapeHTML(r.status)}</span> · ${b.items.length} 项</span></summary><div class="block-body"><ul class="items">${b.items.map(v=>`<li>${escapeHTML(v)}</li>`).join('')}</ul><div class="review-line"><label for="status-${b.id}">审阅判断</label><select id="status-${b.id}" data-review="${b.id}">${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select><span class="small muted">判断的是设计目录是否需要，不代表已生成设定。</span></div><label class="review-note-label" for="note-${b.id}">批注／遗漏补充</label><textarea class="review-note" id="note-${b.id}" data-note="${b.id}" maxlength="5000" placeholder="例如：这里还需要区分灵气的自然再生与人工转化。">${escapeHTML(r.note)}</textarea><p class="print-only" data-print-note="${b.id}">${escapeHTML(r.note)}</p></div></details>`;}
function toolbar(){return `<div class="toolbar"><div><button data-expand="yes">展开全部</button> <button data-expand="no">收起全部</button></div><label>审阅状态<select id="reviewFilter"><option value="all" ${state.status==='all'?'selected':''}>全部状态</option>${statuses.map(s=>`<option ${state.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div>`;}
function emptyHTML(){return '<p class="empty">当前搜索或状态筛选没有匹配项。可清空左侧搜索，或切换为“全部状态”。</p>';}
function renderCatalog(){const g=GENRES.find(g=>g.id===state.genre)||GENRES[0];let list=filteredBlocks(g.blocks);if(state.query&&normalized(g.title+' '+g.tags.join(' ')).includes(normalized(state.query)))list=g.blocks.filter(b=>state.status==='all'||review(b.id).status===state.status);return `<div class="eyebrow">题材专属设计目录</div><h2>${escapeHTML(g.title)}</h2><p class="lead">${escapeHTML(g.description)} 本题材有 ${g.blocks.length} 个专属主题、${itemCount(g.blocks)} 个设计检查项，组合时还应加载通用底层。</p><div class="meta">${g.tags.map(t=>`<span class="badge">${escapeHTML(t)}</span>`).join('')}<span class="badge neutral">AI 展开 · 作者按需介入</span></div><div class="callout"><strong>关联检查：</strong>${escapeHTML(g.audit)}</div><p class="small muted">下列设计问题为本次综合归纳。来源支持题材识别、作者经验或关键方法，并非每个字段都由来源逐项规定。</p><div class="source-links">${sourceLinks(g.sources)}</div>${toolbar()}${list.length?list.map((b,i)=>blockHTML(b,i,i<2)).join(''):emptyHTML()}<div class="section"><button data-view="compose">把此题材加入组合审查 →</button></div>`;}
function renderCore(){const list=filteredBlocks(CORE);return `<div class="eyebrow">跨题材共同底层</div><h2>写任何题材，都要处理的设计面</h2><p class="lead">这里集中维护人物、世界、社会、叙事与表达的通用问题；题材专属模块负责进一步细化。目录是给 AI 的工作清单，创作者无需先逐项填表。</p><div class="meta"><span class="badge">${CORE.length} 个主题</span><span class="badge">${itemCount(CORE)} 个设计项</span></div>${toolbar()}${list.length?list.map((b,i)=>blockHTML(b,i,i===0)).join(''):emptyHTML()}`;}
function renderPlugins(){const list=filteredBlocks(PLUGINS);return `<div class="eyebrow">机制 · 关系 · 风格 · 篇幅</div><h2>跨题材插件</h2><p class="lead">穿越、重生、系统、双男主、无 CP、甜宠和短篇等，不能全部当成互斥的世界题材。选择这些标签后，平台还需补上对应规则与检查。</p><div class="meta"><span class="badge">${PLUGINS.length} 个插件</span><span class="badge">可与任意兼容题材组合</span></div>${toolbar()}${list.length?list.map((b,i)=>blockHTML(b,i,i<2)).join(''):emptyHTML()}`;}
function renderCompose(){return `<div class="eyebrow">组合后检查依赖，而不只拼接名称</div><h2>题材组合审查</h2><p class="lead">选择多个题材，整理它们的设计清单与冲突点。例如：修仙＋种田＋悬疑。此页整理设计需求，不会调用模型或自动生成小说。</p><div class="panel"><label><input type="checkbox" id="includeCore" ${state.includeCore?'checked':''}>包含通用设计底层</label><h3 class="combo-group">选择题材</h3><div class="checks">${GENRES.map(g=>`<label><input type="checkbox" data-combo-genre="${g.id}" ${state.composeGenres.has(g.id)?'checked':''}>${escapeHTML(g.title)}</label>`).join('')}</div><h3 class="combo-group">叠加插件</h3><div class="checks">${PLUGINS.map(b=>`<label><input type="checkbox" data-combo-plugin="${b.id}" ${state.composePlugins.has(b.id)?'checked':''}>${escapeHTML(b.title)}</label>`).join('')}</div><div class="inline-actions"><button id="buildCombo" class="primary">整理组合清单</button><button id="exportCombo">导出组合清单</button></div></div><div id="comboOutput" class="combo-output" aria-live="polite"></div>`;}
function combinationChecks(){const ids=state.composeGenres;const hints=[];const hasAny=arr=>arr.some(id=>ids.has(id));if(ids.has('xianxia')&&hasAny(['farm','business','bureau','palace']))hints.push('修仙 × 社会经营：灵气与寿命会改变资源、继承、劳动和组织稳定性；先统一这些规则。');if(hasAny(['mystery','rules','spy'])&&hasAny(['xianxia','eastern','superpower','science','western','myth']))hints.push('解谜 × 超常能力：先确定能力边界，再安排线索。不能在揭晓时新增能读心、回溯或预言的万能能力。');if(ids.has('apocalypse')&&hasAny(['farm','business','daily']))hints.push('末世 × 经营生活：即时囤积和持续生产分别核算；稳定供水、卫生、维护及群体治理是后续依赖。');if(hasAny(['history','era','war','spy','palace','ancient'])&&state.composePlugins.has('plugin-1'))hints.push('历史背景 × 穿越：确定分歧点、知识落地条件，以及改变发生后哪些旧历史知识不再可靠。');if(hasAny(['romance','ancient','beastworld'])&&state.composePlugins.has('plugin-19'))hints.push('爱情 × 悲剧：明确中文爱情叙事的结局承诺；若标注英文 romance，则应另核对其类型定义，不能同时承诺相反结局。');if(hasAny(['game','esports','sports'])&&hasAny(['infinite','xianxia','superpower']))hints.push('竞技 × 超常成长：明确项目是否允许这些能力；玩家规则、现实身体和职业赛事三个层面分别判断。');if(state.composePlugins.has('plugin-20'))hints.push('关系组合：先确定是否有爱情主线。无 CP 是创作约定，不能在后续自动添加恋爱终局。');if(ids.size>1)hints.push('多题材共有字段需要统一：本页保留各题材命名空间供审阅；未来生成时应合并同一对象，而不是创建相互矛盾的多套规则。');hints.push('通用检查：作者的情绪、钩子和方向优先；模块若产生互相冲突的设定，应给出取舍方案，不能静默改变作者意图。');return hints;}
function comboGroups(){const groups=[];if(state.includeCore)groups.push({title:'通用设计底层',blocks:CORE});for(const g of GENRES)if(state.composeGenres.has(g.id))groups.push({title:g.title,blocks:g.blocks});const plugins=PLUGINS.filter(b=>state.composePlugins.has(b.id));if(plugins.length)groups.push({title:'叠加插件',blocks:plugins});return groups;}
function buildCombo(){const output=$('comboOutput');if(!output)return;const groups=comboGroups();if(!state.composeGenres.size){output.innerHTML='<p class="callout warning" role="alert">请至少选择一个题材。通用底层和插件可以随后叠加。</p>';return;}const total=groups.flatMap(g=>g.blocks);output.innerHTML=`<h3>组合结果：${state.composeGenres.size} 个题材 · ${total.length} 个设计主题 · ${itemCount(total)} 个设计项</h3><div class="callout"><strong>需要共同解决的依赖与冲突</strong><ul>${combinationChecks().map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul></div>${groups.map(group=>`<h3 class="group-title">${escapeHTML(group.title)}</h3>${group.blocks.map((b,i)=>blockHTML(b,i,false)).join('')}`).join('')}`;}
function renderVision(){const stats=`<div class="stat-row"><div><strong>${GENRES.length}</strong><span>题材族</span></div><div><strong>${allBlocks.length}</strong><span>设计主题</span></div><div><strong>${itemCount(allBlocks)}</strong><span>可展开的设计项</span></div><div><strong>${SOURCES.length}</strong><span>公开来源</span></div></div>`;return `<div class="eyebrow">创作者的控制面</div><h2>人确定三件事，AI 负责把它们写成一部小说</h2><p class="lead">这是依据你的愿景整理的目标分工，不是已实现的生成平台。情绪指希望读者经历什么，钩子指为什么继续读，方向指故事朝哪里发展及哪些选择不能改变。</p>${stats}<div class="intent-grid"><div><label for="emotion">情绪</label><textarea id="emotion" data-intent="emotion" maxlength="5000" placeholder="先替普通人憋屈，再看到他以聪明和代价赢回尊严。">${escapeHTML(state.intent.emotion)}</textarea><p class="hint">可描述全书基调，也可指定某卷、某章的情绪变化；角色心理由 AI 据此展开。</p></div><div><label for="hook">钩子</label><textarea id="hook" data-intent="hook" maxlength="5000" placeholder="被判为下品灵根的人，为什么出现在宗门封存的名册里？">${escapeHTML(state.intent.hook)}</textarea><p class="hint">包括谜题、人物牵挂、关系期待与成长回报；不要求每章都制造同类悬崖。</p></div><div><label for="direction">方向</label><textarea id="direction" data-intent="direction" maxlength="5000" placeholder="从个人求生写到改变传承垄断；保留谨慎性格，不自动转成称帝。">${escapeHTML(state.intent.direction)}</textarea><p class="hint">指定目标、结局取向、价值底线、关系约定，以及不想发生的事情。</p></div></div><div class="inline-actions"><button id="exampleIntent">填入修仙示例</button><span class="small muted">输入自动保存到当前浏览器，可随审阅意见导出。</span></div><div class="flow"><span>作者意图</span><b>→</b><span>题材与插件</span><b>→</b><span>设定和社会推演</span><b>→</b><span>人物与事件</span><b>→</b><span>场景与正文</span><b>→</b><span>意图与一致性复核</span></div><div class="section table-wrap"><table><thead><tr><th>作者保留的决定</th><th>AI 可自主展开</th><th>何时返回作者</th></tr></thead><tbody><tr><td>情绪目标和阅读体验</td><td>人物反应、压力、转折、对白、节奏与表达</td><td>方案要改变基调或主要情绪回报时</td></tr><tr><td>核心钩子与兑现取向</td><td>线索、误解、局部答案、揭示顺序及章间期待</td><td>核心钩子无法成立，或必须换成另一个核心问题时</td></tr><tr><td>故事方向和明确边界</td><td>世界规则、能力、社会、配角、支线和具体事件</td><td>需要改变主目标、终局、关系约定或已锁定规则时</td></tr><tr><td>按需介入任何细节</td><td>未指定内容先生成可用方案，沿用已采纳版本</td><td>出现真实冲突或关键选择，不逐项追问所有空白字段</td></tr></tbody></table></div><div class="section"><h3>模块怎样真正组合</h3><p class="lead">每个模块接收：作者意图、题材组合、相关已采纳内容和任务范围；输出：候选内容、依据、依赖、冲突及需更新的事实。题材决定需要哪些能力，不要求把每个主题常驻为一个独立 Agent。</p><div class="mapping-grid"><p><strong>世界与规则 → 社会</strong>能力的可获得性、成本和稀缺性，决定谁能控制资源与知识。</p><p><strong>社会 → 人物</strong>制度决定人物拥有的机会、义务、风险与可行选择。</p><p><strong>人物 → 情节</strong>欲望、认知与关系让人物作决定，再产生真实后果。</p><p><strong>情节 → 情绪与钩子</strong>事件改变读者理解与期待，而不是只增加字数。</p><p><strong>正文 → 记忆与后续</strong>从已采纳正文更新状态，计划、猜测与事实分开。</p><p><strong>审查 → 返工范围</strong>规则冲突退回设定，动机问题退回人物，表达问题局部修订。</p></div></div>`;}
function renderSources(){return `<div class="eyebrow">覆盖范围与证据</div><h2>从平台名称，映射到可组合的设计内容</h2><p class="lead">本版覆盖 ${GENRES.length} 个题材族、${PLUGINS.length} 个跨题材插件。以起点、番茄的公开入口和编辑专题核对范围，再用作者创作谈与专业方法补充设计维度。</p><div class="callout"><strong>“穷尽”的审阅口径：</strong>对已经列入的题材，检查世界、能力、社会、人物、情节、叙述、情绪、钩子与终局是否有相应设计面；允许继续添加新题材、子类型与遗漏项。没有把有限公开样本称作全站数据库，也没有做全量正文统计。</div><h3 class="section">平台入口覆盖映射</h3><div class="mapping-grid section">${PLATFORM_MAP.map(([a,b])=>`<p><strong>${escapeHTML(a)}</strong>${escapeHTML(b)}</p>`).join('')}</div><h3 class="section">来源如何使用</h3><p class="lead">平台分类用于确认“有哪些方向”；编辑专题是特定场景的建议；作者访谈是个人经验；本页的字段、模块边界和组合检查是综合设计推导。军事、法律、医疗、历史和体育等具体事实，在真正创作相关情节时仍需专项考据。部分动态书库仅返回脚本提示，本次采用可访问的首页、编辑文章及作品详情，不声称已读取其全部分类数据。</p>${SOURCES.map(s=>`<article class="source-card"><span class="source-id">${s.id}</span><div><a href="${escapeHTML(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(s.title)}</a><div class="source-type">${escapeHTML(s.type)}</div><p>${escapeHTML(s.note)}</p></div></article>`).join('')}<div class="section"><h3>覆盖自查</h3><p class="lead">覆盖项数量只表示目录规模，不是质量分数。本页不声称这些题材互不重叠，也不强制所有小说使用所有字段。修仙的具体境界、灵气和功法由作品决定；爱情、文学和儿童作品也不套同一套胜负与升级公式。</p></div>`;}
function renderNotes(){const entries=allBlocks.filter(b=>review(b.id).status!=='未审阅'||review(b.id).note);return `<div class="eyebrow">本地审阅记录</div><h2>我的审阅 · ${entries.length} 个主题</h2><p class="lead">可把需要保留、补充或不适用的设计主题标记下来。导出后可在下一轮提供给我继续修改；批注不会自动回传到聊天。</p>${entries.length?entries.map(b=>{const r=review(b.id);return `<article class="notes-card"><h3>${escapeHTML(b.title)} <span class="badge">${escapeHTML(r.status)}</span></h3><span class="small muted">${b.id}</span><p>${escapeHTML(r.note||'未填写文字批注')}</p></article>`}).join(''):'<p class="empty">还没有审阅记录。展开任意设计主题，选择审阅判断并填写批注。</p>'}`;}
function render(){renderNav();document.querySelectorAll('.tabs [data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));const renderers={catalog:renderCatalog,core:renderCore,plugins:renderPlugins,compose:renderCompose,vision:renderVision,sources:renderSources,notes:renderNotes};$('content').innerHTML=renderers[state.view]();if(state.view==='compose')buildCombo();}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportReviews(){const records=allBlocks.filter(b=>review(b.id).status!=='未审阅'||review(b.id).note).map(b=>({id:b.id,title:b.title,...review(b.id)}));download('novel-design-review-notes.json',JSON.stringify({schema:'novel-design-review/1',catalogVersion:'2026-11-12',exportedAt:new Date().toISOString(),intent:state.intent,selectedGenres:[...state.composeGenres],selectedPlugins:[...state.composePlugins],reviews:records},null,2),'application/json;charset=utf-8');$('saveStatus').textContent='已生成审阅意见下载；请确认浏览器下载结果。';}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.genre){state.genre=button.dataset.genre;state.view='catalog';state.status='all';render();}else if(button.dataset.view){if(button.dataset.view==='compose')state.composeGenres.add(state.genre);state.view=button.dataset.view;render();}else if(button.dataset.expand){$('content').querySelectorAll('details').forEach(d=>d.open=button.dataset.expand==='yes');}else if(button.id==='buildCombo'){buildCombo();}else if(button.id==='export'){exportReviews();}else if(button.id==='exportCombo'){if(!state.composeGenres.size){buildCombo();return;}const groups=comboGroups();const text=['# 小说题材组合设计清单','',...Object.entries(state.intent).map(([key,value])=>`${{emotion:'情绪',hook:'钩子',direction:'方向'}[key]}：${value||'未指定'}`),'','## 组合依赖',...combinationChecks().map(t=>'- '+t),...groups.flatMap(g=>['','## '+g.title,...g.blocks.flatMap(b=>['','### '+b.title,...b.items.map(t=>'- '+t)])])].join('\n');download('novel-design-combination.md',text,'text/markdown;charset=utf-8');}else if(button.id==='exampleIntent'){state.intent={emotion:'先替普通人憋屈，再看到他通过聪明选择和真实代价赢回尊严。',hook:'被判为下品灵根的人，为什么出现在宗门封存的名册里？',direction:'从个人求生写到改变传承垄断；保持谨慎性格，不自动转成称帝。'};save();render();}else if(button.id==='print'){const details=[...$('content').querySelectorAll('details')];const previous=details.map(d=>d.open);details.forEach(d=>d.open=true);window.addEventListener('afterprint',()=>details.forEach((d,i)=>d.open=previous[i]),{once:true});window.print();}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='textSize'&&['16','20','24','32'].includes(el.value)){document.documentElement.style.fontSize=el.value+'px';}else if(el.id==='family'){state.family=el.value;renderNav();}else if(el.id==='genreSelect'&&el.value){state.genre=el.value;state.view='catalog';state.status='all';render();}else if(el.id==='reviewFilter'){state.status=el.value;render();}else if(el.dataset.review){const id=el.dataset.review;state.reviews[id]={...review(id),status:statuses.includes(el.value)?el.value:'未审阅'};save();document.querySelectorAll(`[data-status-for="${id}"]`).forEach(n=>n.textContent=el.value);}else if(el.dataset.comboGenre){el.checked?state.composeGenres.add(el.dataset.comboGenre):state.composeGenres.delete(el.dataset.comboGenre);}else if(el.dataset.comboPlugin){el.checked?state.composePlugins.add(el.dataset.comboPlugin):state.composePlugins.delete(el.dataset.comboPlugin);}else if(el.id==='includeCore'){state.includeCore=el.checked;}});
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.note){const id=el.dataset.note;state.reviews[id]={...review(id),note:el.value.slice(0,5000)};save();const printed=document.querySelector(`[data-print-note="${id}"]`);if(printed)printed.textContent=el.value;}else if(el.dataset.intent){state.intent[el.dataset.intent]=el.value.slice(0,5000);save();}});
$('search').addEventListener('compositionstart',()=>composing=true);$('search').addEventListener('compositionend',event=>{composing=false;state.query=event.target.value.trim();render();});$('search').addEventListener('input',event=>{if(composing||event.isComposing)return;state.query=event.target.value.trim();render();});
render();if(!canStore)$('saveStatus').textContent='未能读取浏览器历史记录；可继续审阅，并导出备份。';
})();
</script>
</body>
</html>
