    .wire-pane { padding: 20px 16px; min-width: 0; }

    .wire-center { background: white; padding: 26px; }
    .wire-lines { margin: 20px 0; display: grid; gap: 11px; }
    .wire-lines i { height: 5px; display: block; background: #dbe5dc; border-radius: 2px; }
    .wire-lines i:nth-child(2n) { width: 83%; }
    .wire-lines i:last-child { width: 54%; }
    .wire-link { display: block; min-height: 44px; padding: 8px 0; font-size: 13px; }

    .filter-field input, .filter-field select { min-height: 44px; width: 100%; padding: 8px; font-size: 13px; }
    .empty { padding: 22px 12px; color: var(--muted); font-size: 14px; }

    .step { width: 100%; height: 100%; text-align: left; display: flex; align-items: flex-start; justify-content: flex-start; gap: 11px; border-color: var(--control); padding: 14px 12px; line-height: 1.65; font-size: 13px; }
    .step .number { display: grid; place-items: center; border-radius: 50%; flex-shrink: 0; width: 26px; height: 26px; background: #edf1eb; color: var(--muted); font: 12px/1 ui-monospace, monospace; }

    .text-card p { font-size: 14px; margin-top: 9px; }
    details { border: 1px solid var(--line); border-radius: 10px; background: white; }
    details + details { margin-top: 10px; }

    .details-body dd { margin: 4px 0 0; color: var(--muted); }
    .mode-card { padding: 18px; background: white; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
    .mode-card p { margin-top: 8px; }

    .graph { width: 920px; height: 460px; position: relative; }

    .graph svg { width: 920px; height: 460px; position: absolute; inset: 0; pointer-events: none; }
    .graph-node { position: absolute; width: 180px; height: 67px; justify-content: flex-start; text-align: left; border: 1px solid var(--control); border-radius: 10px; padding: 11px 12px; font-size: 14px; background: white; }
    .graph-node span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 1px; }

    .relation-row .muted { display: block; font-size: 12px; margin-top: 2px; }

      .wire-lines { gap: 9px; margin: 15px 0; }

      .flow-list { grid-template-columns: 1fr; }

      .workspace { display: block; }
      .content { padding: 20px 0; }
      .graph-scroll { overflow: visible; }
      .graph { zoom: .7; }
    }
  </style>
</head>

  <script>
    'use strict';
    const data = JSON.parse(document.getElementById('product-data').textContent);
    const byId = items => new Map(items.map(item => [item.id, item]));
    const featureMap = byId(data.features), pageMap = byId(data.pages), sceneMap = byId(data.scenarios);
    const main = document.getElementById('main');
    const storeKey = 'ainovel.product-review.notes.v1';
    const statuses = ['未审阅', '认可', '需调整', '待讨论'];
    const viewNames = { pages: '页面入口', flows: '场景流程', features: '功能关系', delivery: '分期与验收' };
    let route = { view: 'pages', id: 'P05', step: 0 }, notes = {}, storageAvailable = Boolean(navigator.locks?.request);
    let storedSnapshot = null, storageProtected = false, saveQueue = Promise.resolve();
    let sceneQuery = '', sceneMode = '全部', composing = false;
    const e = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const clean = value => String(value).replace(/\*\*/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/`/g, '');
    const text = value => e(clean(value));
    const announce = message => { document.getElementById('announcement').textContent = message; };
    const tag = (label, style = '') => `<span class="tag ${style}">${text(label)}</span>`;
    const featureLink = id => `<a class="feature-chip" href="#features/${id}"><span class="mono">${id}</span>${text(featureMap.get(id).name)}</a>`;
    const chips = ids => `<div class="chips">${ids.map(featureLink).join('')}</div>`;
    const navItem = (item, view) => `<a class="nav-item" href="#${view}/${item.id}${view === 'flows' ? '/0' : ''}" ${route.id === item.id ? 'aria-current="page"' : ''}><span class="mono">${item.id}</span><span>${text(item.name)}</span></a>`;
    const sceneCard = u => `<a class="scenario-card" href="#flows/${u.id}/0"><span class="mono muted">${u.id}</span><h4>${text(u.name)}</h4><p>${text(u.fields['触发与目标'])}</p><span class="card-link">查看操作流程 →</span></a>`;
    const header = (kind, id, name, lead, badges = []) => `<div class="title-row"><div><p class="eyebrow">${text(kind)}${id ? ` / ${id}` : ''}</p><h2 id="view-title" tabindex="-1">${text(name)}</h2><p class="lead">${text(lead)}</p></div><div class="tags">${badges.join('')}</div></div>`;
    function showStorageNotice(message) {
      const element = document.getElementById('storage-notice'); element.hidden = false; element.textContent = message;
    }
    function loadNotes() {
      if (!storageAvailable) showStorageNotice('此浏览器缺少多窗口保存保护。意见仅保留在当前页面，请导出保存。');
      try {
        storedSnapshot = localStorage.getItem(storeKey);

      document.getElementById('scene-list').innerHTML = sceneList();
      document.getElementById('filter-count').textContent = `显示 ${filteredScenes().length} / 13 个场景；筛选不改变右侧当前流程。`;
      announce(`找到 ${filteredScenes().length} 个场景。`);
    }
    main.addEventListener('compositionstart', event => { if (event.target.id === 'scene-query') composing = true; });
    main.addEventListener('compositionend', event => { if (event.target.id === 'scene-query') { composing = false; sceneQuery = event.target.value; updateSceneFilter(); } });
    main.addEventListener('input', event => {
      if (event.target.id === 'scene-query' && !composing) { sceneQuery = event.target.value; updateSceneFilter(); }
      if (event.target.id === 'review-note') return saveNote();
    });
    main.addEventListener('change', event => {
      if (event.target.id === 'scene-mode') { sceneMode = event.target.value; updateSceneFilter(); }
      if (event.target.id === 'review-status') return saveNote();
    });
    document.getElementById('export-notes').addEventListener('click', exportNotes);
    document.querySelector('.skip').addEventListener('click', event => { event.preventDefault(); main.focus(); });
    window.addEventListener('hashchange', () => {
      const previous = { ...route };
      const graphScroll = main.querySelector('.graph-scroll')?.scrollLeft || 0;
      render();
      if (previous.view === route.view && previous.id === route.id && route.view === 'flows') {
        main.querySelector(`[data-step="${route.step}"]`)?.focus({ preventScroll: true });
      } else if (previous.view === route.view && route.view === 'features') {
        main.querySelector('.graph-scroll').scrollLeft = graphScroll;
        main.querySelector(`[data-feature="${route.id}"]`)?.focus();
      } else document.getElementById('view-title')?.focus();
    });
    loadNotes();
    document.getElementById('source-version').textContent = `设计稿 v0.1 · ${data.date} · ${data.sha256.slice(0, 8)}`;
    render();
  </script>
</body>
</html>
